# ---- ZTNA lab central collector (LOG1) ----
module(load="imudp")
module(load="imtcp")
input(type="imudp" port="514" ruleset="remote")
input(type="imtcp" port="514" ruleset="remote")

# One line per event:
#   <event time, sender clock> rcv=<reception time, LOG1 clock> <host> <program>: <message>
# The event time gives the real timeline; the reception time reveals delays
# (queue replay after an outage) or a sender with a wrong clock.
template(name="ZtnaFmt" type="string"
         string="%timereported:::date-rfc3339% rcv=%timegenerated:::date-rfc3339% %HOSTNAME% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")

# Per-host / per-program files. Host and program names come from the sender,
# so secpath-replace neutralises "/" and ".." to keep every file inside /var/log/ztna.
template(name="PerHost" type="string"
         string="/var/log/ztna/%HOSTNAME:::secpath-replace%/%PROGRAMNAME:::secpath-replace%.log")

# Storage, shared by remote and local messages (a single writer per file).
ruleset(name="store") {
    action(type="omfile" file="/var/log/ztna/all.log" template="ZtnaFmt"
           fileCreateMode="0640" fileGroup="adm")
    action(type="omfile" dynaFile="PerHost" template="ZtnaFmt" createDirs="on"
           dirCreateMode="0750" dirGroup="adm" fileCreateMode="0640" fileGroup="adm")
}

# Messages from the network: store them, nothing else.
ruleset(name="remote") {
    call store
    stop
}

# LOG1's own messages (sshd, sudo, ufw, kernel): store them as well,
# then continue to the normal local files (/var/log/syslog, auth.log, ufw.log).
call store
