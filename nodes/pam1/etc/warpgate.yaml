  host_key_verification: prompt
  inactivity_timeout: 5m
  keepalive_interval: null
  target_handshake_timeout: 30s
http:
  listen: 0.0.0.0:443
  proxy_protocol: false
  external_port: null
  external_host: null
  certificate: /etc/warpgate-tls/pam.crt
  key: /etc/warpgate-tls/pam.key
  trust_x_forwarded_headers: false
  session_max_age: 30m
  cookie_max_age: 1day
  sni_certificates: []
kubernetes:
  enable: false
  listen: '[::]:8443'
  proxy_protocol: false
  external_port: null
  external_host: null
  certificate: /etc/warpgate-tls/pam.crt
  key: /etc/warpgate-tls/pam.key
  session_max_age: 30m
mysql:
  enable: false
  listen: '[::]:33306'
  proxy_protocol: false
  external_port: null
  external_host: null
  certificate: /etc/warpgate-tls/pam.crt
  key: /etc/warpgate-tls/pam.key
  advertised_version: 8.0.3-Warpgate
postgres:
  enable: false
  listen: '[::]:55432'
  proxy_protocol: false
  external_port: null
  external_host: null
  certificate: /etc/warpgate-tls/pam.crt
  key: /etc/warpgate-tls/pam.key
vnc:
  enable: false
  listen: '[::]:5900'
