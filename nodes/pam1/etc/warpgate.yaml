  key: /etc/warpgate-tls/pam.key
log:
  retention: 7days
  audit_retention: 11months 30days 3h 50m 24s
  send_to: null
  format: text
sso_providers:
  - name: keycloak
    label: ZTNA Keycloak
    provider:
      type: custom
      client_id: warpgate
      client_secret: <REDACTED>
      issuer_url: https://auth.ztna.lab/realms/ztna
      scopes: ["email", "profile"]
      roles_claim: groups
      role_mappings:
        it-admins: ops
      admin_roles_claim: groups
      admin_role_mappings:
        pam-approvers: approver
