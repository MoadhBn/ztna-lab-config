# Forward all local logs to the central collector LOG1 (10.10.30.20:514/tcp).
# RFC 5424 format: full timestamp (year, sub-seconds, time zone) and structured header.
# Octet-counted framing: a message containing a newline stays one message.
# Disk-assisted queue: messages are kept while LOG1 is unreachable, capped at 100 MB
# so a long LOG1 outage can never fill this server's disk.
action(type="omfwd" target="10.10.30.20" port="514" protocol="tcp"
       template="RSYSLOG_SyslogProtocol23Format"
       TCP_Framing="octet-counted"
       queue.type="LinkedList" queue.filename="fwd_ztna"
       queue.maxDiskSpace="100m" queue.saveOnShutdown="on"
       action.resumeRetryCount="-1")
