ssl_certificate     /etc/ssl/ztna/appserver.crt;
ssl_certificate_key /etc/ssl/ztna/appserver.key;
ssl_protocols       TLSv1.2 TLSv1.3;
add_header Strict-Transport-Security "max-age=31536000" always;

proxy_buffer_size       128k;
proxy_buffers           4 256k;
proxy_busy_buffers_size 256k;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $ztna_fwd_host;
proxy_set_header X-Forwarded-Port  443;
access_log /var/log/nginx/access.log ztna;
access_log syslog:server=unix:/dev/log,tag=nginx,severity=info,nohostname ztna;
error_log  syslog:server=unix:/dev/log,tag=nginx,nohostname warn;
