# Access log format for the ZTNA apps (used by snippets/ztna-common.conf).
# upstream=$upstream_status separates denials by nginx itself ("-": context rule)
# from denials by oauth2-proxy ("403": wrong group). The request is logged without
# its query string ($uri), so OAuth code/state values never reach the logs (fix #21).
log_format ztna '$remote_addr host=$host "$request_method $uri $server_protocol" status=$status upstream=$upstream_status bytes=$body_bytes_sent ua="$http_user_agent"';
