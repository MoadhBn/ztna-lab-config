# Keycloak serves its admin console only on KC_HOSTNAME_ADMIN (kcadmin.pam.ztna.lab).
# Warpgate (PAM1) forwards with Host auth.ztna.lab, so requests from PAM1 are announced
# to Keycloak under the admin address. Every other client keeps its own Host.
map $remote_addr $ztna_fwd_host {
    10.10.60.10  kcadmin.pam.ztna.lab;
    default      $host;
}
